<div class="qr-stage" [class.qr-stage--static]="reducedMotion()">
  <div class="qr-glow"></div>

  <div class="qr-frame">
    <svg class="qr-svg" [attr.viewBox]="viewBox" role="presentation" focusable="false">
      <defs>
        <linearGradient id="qrScanBeam" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="var(--color-limed-spruce-50)" stop-opacity="0" />
          <stop offset="45%" stop-color="var(--color-limed-spruce-50)" stop-opacity="0.18" />
          <stop offset="50%" stop-color="var(--color-accent)" stop-opacity="0.55" />
          <stop offset="55%" stop-color="var(--color-limed-spruce-50)" stop-opacity="0.18" />
          <stop offset="100%" stop-color="var(--color-limed-spruce-50)" stop-opacity="0" />
        </linearGradient>
        <filter id="qrScanGlow" x="-80%" y="-20%" width="260%" height="140%">
          <feGaussianBlur stdDeviation="0.28" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>

      <rect
        class="qr-plate"
        x="-0.65"
        y="-0.65"
        [attr.width]="size + 1.3"
        [attr.height]="size + 1.3"
        rx="1.1"
      />

      @for (module of modules; track module.id) {
        <rect
          class="qr-module"
          [attr.data-kind]="module.kind"
          [attr.data-col]="module.x"
          [attr.data-row]="module.y"
          [attr.x]="module.x + 0.08"
          [attr.y]="module.y + 0.08"
          width="0.84"
          height="0.84"
          rx="0.08"
        />
      }

      <g class="qr-scan">
        <rect
          [attr.x]="-1.15"
          [attr.y]="-0.85"
          width="2.3"
          [attr.height]="size + 1.7"
          fill="url(#qrScanBeam)"
        />
        <rect
          class="qr-scan-core"
          [attr.x]="-0.1"
          [attr.y]="-0.85"
          width="0.2"
          [attr.height]="size + 1.7"
          filter="url(#qrScanGlow)"
        />
      </g>

      <g class="qr-particles">
        @for (particle of particles; track particle) {
          <circle class="qr-particle" [attr.cx]="center" [attr.cy]="center" r="0.16" />
        }
      </g>
    </svg>
  </div>
</div>
