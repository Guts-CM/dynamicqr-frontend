<section class="dash">
  <div class="dash-atmosphere" aria-hidden="true">
    <span class="dash-glow dash-glow--left"></span>
    <span class="dash-glow dash-glow--right"></span>
    <span class="dash-streak"></span>
  </div>

  <div class="dash-shell">
    <header class="navbar">
      <a class="brand" href="/dashboard" (click)="$event.preventDefault()">
        <span class="brand-mark" aria-hidden="true">
          <i></i><i></i><i></i>
        </span>
        <span class="brand-name">DynamicQR</span>
      </a>

      <nav class="nav-center" aria-label="Secciones">
        @for (item of navItems; track item) {
          <button
            type="button"
            class="nav-link"
            [class.is-active]="item === 'Panel'"
            [attr.aria-current]="item === 'Panel' ? 'page' : null"
          >
            {{ item }}
          </button>
        }
      </nav>

      <div class="nav-actions">
        <button type="button" class="logout-btn" (click)="signOut()" aria-label="Cerrar sesión">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M10 5.5H7.2A2.2 2.2 0 0 0 5 7.7v8.6A2.2 2.2 0 0 0 7.2 18.5H10" />
            <path d="M10 12h9" />
            <path d="m16.2 8.8 3.8 3.2-3.8 3.2" />
          </svg>
          <span>Cerrar sesión</span>
        </button>
      </div>
    </header>

    <div class="dash-body">
      <main class="main">
        <header class="welcome">
          <div>
            <h1>Bienvenido de nuevo, <span>{{ displayName }}</span></h1>
            <p>Gestiona, genera y da seguimiento a tus códigos QR desde un solo lugar.</p>
          </div>
          <div class="welcome-meta">
            <span class="date-chip">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <rect x="4" y="5.5" width="16" height="14" rx="2.2" />
                <path d="M8 3.8v3.4M16 3.8v3.4M4 10h16" />
              </svg>
              17 sep 2026
            </span>
            <button type="button" class="cta">
              <span aria-hidden="true">+</span>
              Nuevo código QR
            </button>
          </div>
        </header>

        <div class="grid">
          <app-dashboard-user-card class="cell-user" (logout)="signOut()" />
          <app-dashboard-chart-card class="cell-chart" />
          <app-dashboard-reserved-card class="cell-reserved" />
          <app-dashboard-records-card class="cell-records" />
        </div>
      </main>
    </div>
  </div>
</section>
