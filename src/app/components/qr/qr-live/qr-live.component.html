<div
  class="qr-live"
  [class.is-static]="reducedMotion()"
  (pointerenter)="onPointerEnter($event)"
  (pointermove)="onPointerMove($event)"
  (pointerleave)="onPointerLeave()"
  (pointercancel)="onPointerLeave()"
>
  <div class="qr-aura" aria-hidden="true"></div>

  <div class="qr-rig">
    <svg class="qr-svg" [attr.viewBox]="viewBox" role="presentation" focusable="false">
      <defs>
        <linearGradient [attr.id]="uid + '-beam'" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--color-limed-spruce-50)" stop-opacity="0" />
          <stop offset="42%" stop-color="var(--color-limed-spruce-50)" stop-opacity="0.16" />
          <stop offset="50%" stop-color="var(--color-accent)" stop-opacity="0.62" />
          <stop offset="58%" stop-color="var(--color-limed-spruce-50)" stop-opacity="0.16" />
          <stop offset="100%" stop-color="var(--color-limed-spruce-50)" stop-opacity="0" />
        </linearGradient>
      </defs>

      <rect
        class="qr-plate"
        x="-0.55"
        y="-0.55"
        [attr.width]="size + 1.1"
        [attr.height]="size + 1.1"
        rx="1.05"
      />

      @for (module of modules; track module.id) {
        <rect
          class="qr-mod"
          [attr.data-kind]="module.kind"
          [attr.data-col]="module.x"
          [attr.data-row]="module.y"
          [attr.x]="module.x + 0.1"
          [attr.y]="module.y + 0.1"
          width="0.8"
          height="0.8"
          rx="0.09"
        />
      }

      <g class="qr-beam">
        <rect
          [attr.x]="-0.85"
          [attr.y]="center - 0.85"
          [attr.width]="size + 1.7"
          height="1.7"
          [attr.fill]="'url(#' + uid + '-beam)'"
        />
      </g>

      @for (particle of particles; track particle) {
        <circle class="qr-spark" [attr.cx]="center" [attr.cy]="center" r="0.18" />
      }
    </svg>
  </div>
</div>
